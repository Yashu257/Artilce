<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="ciplaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="crossV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6FFFA" />
    </linearGradient>
    <linearGradient id="crossH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="redNode" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </radialGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#042F2E" flood-opacity="0.3" />
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#021E1E" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#ciplaBg)" filter="url(#badgeShadow)" />
  <rect x="7" y="7" width="106" height="106" rx="27" fill="none" stroke="#5EEAD4" stroke-width="1.5" stroke-opacity="0.35" />

  <path d="M 32 86 C 22 62, 38 32, 66 28 C 88 24, 98 44, 90 68 C 84 82, 66 94, 46 88" 
        fill="none" stroke="url(#orbitGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="80 20" opacity="0.75" />

  <g filter="url(#iconShadow)">
    <rect x="51" y="27" width="18" height="66" rx="9" fill="url(#crossV)" />
    <rect x="27" y="51" width="66" height="18" rx="9" fill="url(#crossH)" />
  </g>

  <rect x="54" y="54" width="12" height="12" rx="3" fill="#0F766E" />
  <circle cx="60" cy="60" r="2.5" fill="#5EEAD4" />

  <circle cx="86" cy="34" r="8" fill="url(#redNode)" filter="url(#iconShadow)" />
  <circle cx="84" cy="32" r="2.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="86" cy="34" r="12" fill="none" stroke="#EF4444" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 2" />
</svg>
