services:
  # ============================================================================
  # Cipla MedKnowledge Backend - PHP 8.3 Microservice (Docker)
  # ============================================================================
  - type: web
    name: cipla-articles-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  # ============================================================================
  # Cipla MedKnowledge Frontend - React 19 + Vite (Static Site)
  # ============================================================================
  - type: web
    name: cipla-articles-frontend
    env: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
